<style>

    justify-content: space-around;

  }

 
  .categories {

  .cat-btn {

  }

  .cat-btn.active {

    color: rgb(205, 193, 21);

  .menu {

  }

  .item {
    display: flex;
    justify-content: space-between;
    background: rgb(135, 123, 203);
    margin-bottom: 10px;
    padding: 10px;
    border-radius: 10px;
  }

  .price {
    color: #ff6b35;
    font-weight: bold;
  }

  button {
    background: green;
    color: white;
    border: none;
    padding: 5px 8px;
    border-radius: 5px;
    cursor: pointer;
  }
 html { scroll-behavior: smooth; }

.header-image {
    position: relative;
    width: 100%;
}

.header-image img {
    width: 100%;
    display: block;
    border-radius: 10px;
}


.title-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    text-align: center;

   
    background: rgba(0, 0, 0, 0.4);
    padding: 8px 25px;
    border-radius: 10px;
}

.title-text h1 {
    margin: 0;
    font-size: 28px;
}

.title-text p {
    margin: 5px 0 0;
    font-size: 16px;
    color: #ddd;
}

function buildMenu() {
  const menu = document.getElementById("menu");
  MENU_DATA.forEach(cat => {
    cat.items.forEach(item => {
      const div = document.createElement("div");
      div.className = "item " + cat.id;
      div.setAttribute("data-name", item.name.toLowerCase());
      div.innerHTML = `
        <div>${item.name}</div>
        <div>
          <span class="price">${item.price}</span>
          <button onclick="add('${item.name}', ${item.price})">Add</button>
        </div>`;
      menu.appendChild(div);
    });
  });
}

function filter(cat) {
  let items = document.querySelectorAll(".item");
  let buttons = document.querySelectorAll(".cat-btn");

  buttons.forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");

  items.forEach(i => {
    i.style.display = (cat === "all" || i.classList.contains(cat)) ? "flex" : "none";
  });
}

function searchFood() {
  let input = document.getElementById("search").value.toLowerCase();
  let items = document.querySelectorAll(".item");

  items.forEach(i => {
    let name = i.getAttribute("data-name");
    i.style.display = name.includes(input) ? "flex" : "none";
  });
}
